{% set b = backtest %}
<p class="matchup-subtitle" style="margin-bottom:14px;">
  Replays every completed match stored for this league through the ratings-only model
  and compares it against the bookmaker odds recorded at the time.
</p>
<div id="backtest-form" class="matchup-controls">
  <input type="hidden" name="league_url" value="{{ b.league_url }}">
  <div class="control">
    <label for="backtest-edge">Value edge threshold %</label>
    <input id="backtest-edge" name="edge_threshold" type="number" min="0" step="0.5" value="{{ b.edge_threshold_percent }}"
      hx-get="/fragments/backtest"
      hx-trigger="change delay:400ms"
      hx-target="#backtest-result"
      hx-swap="innerHTML"
      hx-include="#backtest-form"
      hx-indicator="#backtest-spinner">
  </div>
  <div class="control">
    <label for="backtest-stake">Flat stake (units)</label>
    <input id="backtest-stake" name="stake" type="number" min="0.1" step="0.5" value="{{ b.stake }}"
      hx-get="/fragments/backtest"
      hx-trigger="change delay:400ms"
      hx-target="#backtest-result"
      hx-swap="innerHTML"
      hx-include="#backtest-form"
      hx-indicator="#backtest-spinner">
  </div>
</div>
<div class="market-meta" style="margin:8px 0 14px;">
  <span id="backtest-spinner" class="htmx-indicator">Recalculating&hellip;</span>
</div>
<div id="backtest-result">
  {% include "fragments/backtest_result.html" %}
</div>
