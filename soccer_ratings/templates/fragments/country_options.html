{% set selected_country = selected_country | default("") %}
<option value="">Choose a country</option>
{% for continent_name, continent_countries in grouped.items() %}
<optgroup label="{{ continent_name }}">
  {% for c in continent_countries %}
  <option value="{{ c.country_path }}"{% if c.country_path == selected_country %} selected{% endif %}>{{ c.country }}</option>
  {% endfor %}
</optgroup>
{% endfor %}
