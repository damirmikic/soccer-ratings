<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin login &ndash; ratings1x2</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell" style="max-width: 420px;">
    <header class="brand-header">
      <div class="brand-logo-container">
        <span class="brand-wordmark">ratings1x2 admin</span>
      </div>
    </header>

    {% if disabled %}
    <p class="market-meta">
      Admin actions are disabled. Set the <code>ADMIN_TOKEN</code> environment
      variable to enable this page.
    </p>
    {% else %}
    {% if error %}
    <p class="market-meta" style="color: #ef233c;">Invalid admin token.</p>
    {% endif %}
    <form method="post" action="/admin/login">
      <div class="control">
        <label for="admin_token">Admin token</label>
        <input id="admin_token" name="admin_token" type="password" autocomplete="off" required autofocus>
      </div>
      <button type="submit" style="margin-top: 12px;">Log in</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
